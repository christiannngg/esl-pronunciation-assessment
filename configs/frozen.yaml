# Sprint 4 frozen-encoder settings (read by src/features/ssl_embeddings.py)
seed: 42

# Pretrain-only base checkpoints (same size, so the comparison is clean). Larger / ASR-finetuned checkpoints are US 4.3 candidates.
# `revision: null` uses the hub's default branch; the resolved commit hash is written to each cache's manifest.json.
encoders:
  wav2vec2_base:   {hf_id: facebook/wav2vec2-base,    revision: null}
  hubert_base:     {hf_id: facebook/hubert-base-ls960, revision: null}
  wavlm_base_plus: {hf_id: microsoft/wavlm-base-plus,  revision: null}

extraction:
  device: auto              # auto -> cuda, then mps, then cpu
  cache_dtype: float16      # pooled vectors are stored as fp16 (about 6 GB per base encoder, all 13 layers)
  shard_size: 250           # utterances per resume checkpoint
  # cache_root: null        # default <data_root>/processed/features/ssl ; override with --cache-root or $SSL_CACHE_ROOT

# Units are exactly the Sprint 3 rows (same order as data/processed/features/tables/<unit>_meta.csv.gz):
#   *_sentence  mean||std over all frames of the file           -> (n, layers, 2*dim)
#   *_word      mean over the word's aligned frames              -> (n, layers, dim)
#   so762_word_ms  [max || std] over the same word frames as so762_word -> (n, layers, 2*dim)   (US 4.3, word-accuracy pooling)
#   so762_phone mean over the MFA phone interval                 -> (n, layers, dim)
#   l2_phone    mean over the FIXED window around the annotated unit midpoint (half-width = baseline.yaml l2arctic_window_half_s)
units: [so762_sentence, so762_word, so762_phone, l2_word, l2_phone, so762_word_ms]   # so762_word_ms (US 4.3): same word spans pooled as [max, std]

# ---- US 4.1 task heads on the frozen embeddings (read by src/models/frozen_heads.py) --------------------------------------------
heads:
  device: auto
  primary_layer: 12          # layer used for the first benchmark; the per-layer sweep (US 4.2 / 4.3) varies this. 0 = conv front end, 1..12 = transformer
  heads: [linear, mlp]
  seeds: [0, 1, 2]           # `search` stage uses the first seed only; `final` re-fits the selected configs with all of them
  mlp: {hidden: 512}
  train: {lr: 0.002, batch_size: 1024, max_epochs: 40, patience: 5, train_eval_rows: 20000}   # early stopping on validation loss
  tasks: [sent_accuracy, sent_fluency, sent_prosodic, sent_total, word_accuracy, phone_score, phone_mispron_t1.0, l2_phone_error, l2_word_error]
  grids:                     # tuned on VALIDATION only (regression RMSE, classification macro-F1); cw = class weights in the loss
    reg:
      linear: {wd: [0.0001, 0.01]}
      mlp: {dropout: [0.1, 0.3], wd: [0.01]}
    clf:
      linear: {wd: [0.001], cw: [none, balanced]}
      mlp: {dropout: [0.1, 0.3], wd: [0.01], cw: [none, balanced]}
  probe:                     # US 4.2 per-layer sweep: one linear head per task, one seed (layer 12 is already covered by the main search)
    tasks: [sent_accuracy, sent_fluency, sent_prosodic, sent_total, word_accuracy, phone_score, phone_mispron_t1.0, l2_phone_error, l2_word_error]   # the 3 extra sentence tasks were added for the US 4.3 layer re-selection
    grids:
      reg: {linear: {wd: [0.01]}}
      clf: {linear: {wd: [0.001], cw: [balanced]}}

# ---- US 4.3 fixes (read by src/models/frozen_fix.py and src/evaluation/report_us43.py) -----------------------------------------------
fix43:
  root: experiments/results/frozen43     # <root>/<encoder>/<recipe>/<task>/<head>/<config>[__final]/fold<k>.npz  (+ <encoder>/mispron/oof.npz)
  seeds_final: [0, 1, 2, 3, 4]           # `final` seed averaging for recipes that do not set `seeds` (the sentence recipes; US 4.1 used 3); `search` uses the first seed
  ws_layers: [0, 12]                     # layers entering the learned weighted sum (inclusive; 0 = conv front end, which the probe showed can matter)
  layer_window: [6, 12]                  # fix 1: layers a task may be re-selected from
  shortlist_k: 2                         # fix 1: layers per task that get the full head protocol (probe-validation ranked)
  mispron:                               # fix 5: per-age-group decision weights
    n_folds: 5                           #   speaker-grouped out-of-fold probabilities over the TRAIN speakers
    keep_if_pooled_val_drop_at_most: 0.005   #   group-specific weights are kept if pooled validation macro-F1 is not worse than global weights by more than this
  recipes:
    # fix 2: learned layer-weighted sum, every task, the US 4.1 grids (so the delta isolates the weighted sum)
    ws:
      layer: ws
      tasks: [sent_accuracy, sent_fluency, sent_prosodic, sent_total, word_accuracy, phone_score, phone_mispron_t1.0, l2_phone_error, l2_word_error]
      inputs: [emb, side]
      seeds: [0, 1, 2]                   # same number of seeds as US 4.1, so the delta isolates the weighted sum
    # fix 3: sentence regularisation (stronger weight decay / dropout / input dropout, PCA, 5-seed averaging), with and without the US 3.3 prosody columns
    sent_ws:
      layer: ws
      tasks: &sent [sent_accuracy, sent_fluency, sent_prosodic, sent_total]
      inputs: [emb, side]
      hidden: 256
      grids: &sent_grids
        reg:
          linear: {wd: [0.01, 0.1, 1.0], in_drop: [0.0, 0.2]}
          mlp: {dropout: [0.3, 0.5], wd: [0.1], in_drop: [0.0, 0.2]}
        clf: {linear: {wd: [0.001], cw: [none, balanced]}, mlp: {dropout: [0.1], wd: [0.01], cw: [none, balanced]}}
    sent_ws_pros:
      layer: ws
      tasks: *sent
      inputs: [emb, side, pros]
      hidden: 256
      grids: *sent_grids
    sent_avgpca:
      layer: avg6-12
      tasks: *sent
      inputs: [emb, side]
      hidden: 256
      grids: &sent_pca_grids
        reg:
          linear: {wd: [0.01, 0.1, 1.0], pca: [32, 64, 128]}
          mlp: {dropout: [0.3, 0.5], wd: [0.1], pca: [32, 64, 128]}
        clf: {linear: {wd: [0.001], cw: [none, balanced]}, mlp: {dropout: [0.1], wd: [0.01], cw: [none, balanced]}}
    sent_avgpca_pros:
      layer: avg6-12
      tasks: *sent
      inputs: [emb, side, pros]
      hidden: 256
      grids: *sent_pca_grids
    # fix 4: word accuracy, pooling over the word's frames. word_mean_pros is the control (same inputs, mean pooling only).
    word_mean_pros:
      layer: ws
      pool: mean
      tasks: [word_accuracy]
      inputs: [emb, side, pros]
      seeds: [0, 1, 2]
    word_max_pros:
      layer: ws
      pool: max
      tasks: [word_accuracy]
      inputs: [emb, side, pros]
      seeds: [0, 1, 2]
    word_meanmax_pros:
      layer: ws
      pool: mean+max
      tasks: [word_accuracy]
      inputs: [emb, side, pros]
      seeds: [0, 1, 2]
    word_meanmaxstd_pros:
      layer: ws
      pool: mean+max+std
      tasks: [word_accuracy]
      inputs: [emb, side, pros]
      seeds: [0, 1, 2]

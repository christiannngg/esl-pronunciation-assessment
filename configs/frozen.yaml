# Sprint 4 frozen-encoder settings (read by src/features/ssl_embeddings.py)
seed: 42

# Pretrain-only base checkpoints (same size, so the comparison is clean). Larger / ASR-finetuned checkpoints are US 4.3 candidates.
# `revision: null` uses the hub's default branch; the resolved commit hash is written to each cache's manifest.json.
encoders:
  wav2vec2_base:   {hf_id: facebook/wav2vec2-base,    revision: null}
  hubert_base:     {hf_id: facebook/hubert-base-ls960, revision: null}
  wavlm_base_plus: {hf_id: microsoft/wavlm-base-plus,  revision: null}

extraction:
  device: auto              # auto -> cuda, then mps, then cpu
  cache_dtype: float16      # pooled vectors are stored as fp16 (about 6 GB per base encoder, all 13 layers)
  shard_size: 250           # utterances per resume checkpoint
  # cache_root: null        # default <data_root>/processed/features/ssl ; override with --cache-root or $SSL_CACHE_ROOT

# Units are exactly the Sprint 3 rows (same order as data/processed/features/tables/<unit>_meta.csv.gz):
#   *_sentence  mean||std over all frames of the file           -> (n, layers, 2*dim)
#   *_word      mean over the word's aligned frames              -> (n, layers, dim)
#   so762_phone mean over the MFA phone interval                 -> (n, layers, dim)
#   l2_phone    mean over the FIXED window around the annotated unit midpoint (half-width = baseline.yaml l2arctic_window_half_s)
units: [so762_sentence, so762_word, so762_phone, l2_word, l2_phone]

# ---- US 4.1 task heads on the frozen embeddings (read by src/models/frozen_heads.py) --------------------------------------------
heads:
  device: auto
  primary_layer: 12          # layer used for the first benchmark; the per-layer sweep (US 4.2 / 4.3) varies this. 0 = conv front end, 1..12 = transformer
  heads: [linear, mlp]
  seeds: [0, 1, 2]           # `search` stage uses the first seed only; `final` re-fits the selected configs with all of them
  mlp: {hidden: 512}
  train: {lr: 0.002, batch_size: 1024, max_epochs: 40, patience: 5, train_eval_rows: 20000}   # early stopping on validation loss
  tasks: [sent_accuracy, sent_fluency, sent_prosodic, sent_total, word_accuracy, phone_score, phone_mispron_t1.0, l2_phone_error, l2_word_error]
  grids:                     # tuned on VALIDATION only (regression RMSE, classification macro-F1); cw = class weights in the loss
    reg:
      linear: {wd: [0.0001, 0.01]}
      mlp: {dropout: [0.1, 0.3], wd: [0.01]}
    clf:
      linear: {wd: [0.001], cw: [none, balanced]}
      mlp: {dropout: [0.1, 0.3], wd: [0.01], cw: [none, balanced]}
  probe:                     # US 4.2 per-layer sweep: one linear head per task, one seed (layer 12 is already covered by the main search)
    tasks: [sent_accuracy, word_accuracy, phone_score, phone_mispron_t1.0, l2_phone_error, l2_word_error]
    grids:
      reg: {linear: {wd: [0.01]}}
      clf: {linear: {wd: [0.001], cw: [balanced]}}
